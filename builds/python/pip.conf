# Multi-source pip config for riscv64 musl (OpenHarmony K3)
# 1) TUNA PyPI mirror (primary, CN-fast, pure-python + rare musllinux riscv64 wheels)
# 2) Aliyun PyPI mirror (fallback)
# 3) harmonybrew riscv64 musl wheel index (self-built cp312 wheels)
[global]
index-url = https://pypi.tuna.tsinghua.edu.cn/simple/
extra-index-url =
	https://mirrors.aliyun.com/pypi/simple/
	https://shihuan1999.github.io/homebrew-riscv/wheels/simple/
disable-pip-version-check = true
timeout = 60
retries = 3
