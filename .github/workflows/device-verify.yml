name: device-verify

# 真机验证：在有 hdc 的网关 runner（label: pico-gw）上，把 bottle 通过
# hdc 预置进设备 brew 缓存，设备端真实 `brew install` + `brew test`。
# 触发：PR 打 device-verify 标签，或手动 dispatch。
on:
  pull_request:
    types: [labeled]
  workflow_dispatch:
    inputs:
      formula:
        description: "formula 名（如 figlet）"
        required: true
      hdc_target:
        description: "hdc -t 目标（留空自动取第一个在线设备）"
        required: false
        default: ""

permissions:
  contents: read
  pull-requests: write

jobs:
  smoke:
    if: >
      github.event_name == 'workflow_dispatch' ||
      contains(join(github.event.pull_request.labels.*.name, ','), 'device-verify')
    runs-on: [self-hosted, pico-gw]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: run device smoke test
        id: smoke
        run: |
          bash contrib/device-smoke.sh \
            "${{ github.event.inputs.formula }}" \
            "${{ github.event.inputs.hdc_target }}" \
            | tee smoke.log
          echo "exitcode=$?" >> "$GITHUB_OUTPUT"

      - name: comment PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let log = '';
            try { log = fs.readFileSync('smoke.log', 'utf8').slice(-3000); } catch (e) {}
            const ok = '${{ steps.smoke.outputs.exitcode }}' === '0';
            const body = `### ${ok ? '✅' : '❌'} device-verify 真机冒烟${ok ? '通过' : '失败'}\n\`\`\`\n${log}\n\`\`\``;
            await github.rest.issues.createComment({
              owner: context.repo.owner, repo: context.repo.repo,
              issue_number: context.issue.number, body
            });
